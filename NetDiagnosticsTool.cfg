# NetDiagnosticsTool configuration
# Format: key = value. Lines starting with '#' are comments.
# Relative paths are resolved against the project root directory.

# Directory where the monitoring scripts write their CSV logs
# (system_stats.csv, network_stats.csv) before they are imported into the database.
csv_log_directory = Data

# Sqlite database file the CSV logs are imported into.
database_file = Data/NetDiagnostics.db
